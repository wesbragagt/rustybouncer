name: Release images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.0.1
        required: true
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustybouncer
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: cachix/install-nix-action@v31
      - name: Build image
        run: nix build .#docker --no-update-lock-file --out-link result-image
      - name: Push ${{ matrix.arch }} image
        run: >
          nix run nixpkgs#skopeo -- copy
          --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          docker-archive:result-image
          "docker://$IMAGE:${TAG#v}-${{ matrix.arch }}"

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        run: |
          v="${TAG#v}"
          for t in "$v" latest; do
            docker buildx imagetools create -t "$IMAGE:$t" "$IMAGE:$v-amd64" "$IMAGE:$v-arm64"
          done
