name: Verification and pooler conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Locked typechecking, linting, complexity and offline tests
        run: nix flake check --no-update-lock-file
      - name: Build target
        run: nix develop --command cargo build --locked
      - name: Common assertions against reference and target, native PostgreSQL
        run: nix develop --command python3 -m conformance.adapters.local --output "$RUNNER_TEMP/conformance-local" --repeat 2
      - name: Common assertions with Docker PostgreSQL and poolers
        run: nix develop --command python3 -m conformance.adapters.local --output "$RUNNER_TEMP/conformance-docker" --docker-postgres --docker-poolers --repeat 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pooler-conformance
          path: |
            ${{ runner.temp }}/conformance-local
            ${{ runner.temp }}/conformance-docker

  kind-cnpg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build distroless image
        run: nix build .#docker --no-update-lock-file --out-link result-image
      - name: Load image into Docker
        run: docker load -i result-image
      - name: Real kind and CloudNativePG routing, metrics and failover
        run: nix develop --command python3 -m tests.kind_cnpg --output "$RUNNER_TEMP/kind-cnpg"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kind-cnpg
          path: |
            ${{ runner.temp }}/kind-cnpg/results.json
            ${{ runner.temp }}/kind-cnpg/junit.xml
            ${{ runner.temp }}/kind-cnpg/events.jsonl
            ${{ runner.temp }}/kind-cnpg/metrics-*.prom
            ${{ runner.temp }}/kind-cnpg/*.log
