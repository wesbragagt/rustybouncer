listen = "127.0.0.1:6432"
max_clients = 100
# Optional private Prometheus endpoint; absent means instrumentation is disabled.
# metrics_listen = "127.0.0.1:9090"
# Opt-in simple-query routing; requires trusted, trust-authenticated backends.
# Set false for the original transparent-authentication session router.
route_selects = true
# Shared primary session reuse is opt-in and still uses routed trust authentication.
# none keeps the historical per-client routed caches; transaction is pending PERF-008.
pool_mode = "none"
pool_size = 16
max_pool_backends = 64
reserve_pool_size = 0
reserve_pool_delay_ms = 1000
pool_idle_timeout_ms = 30000
pool_server_lifetime_ms = 300000
pool_reset_timeout_ms = 5000
probe_interval_ms = 500
probe_timeout_ms = 1000
wait_timeout_ms = 10000
startup_timeout_ms = 5000
# Per eligible read attempt, independent of routing wait.
query_timeout_ms = 300000
# Total eligible-read budget: routing, setup, execution and retries combined.
read_retry_timeout_ms = 600000
# Includes the first attempt and failed backend setup; only buffered pure reads retry.
read_max_attempts = 3
probe_user = "postgres"
probe_database = "postgres"
# Optional: read the probe password from this environment variable.
# probe_password_env = "RUSTYBOUNCER_PROBE_PASSWORD"

# Routed result storage and cleanup. Slab capacity includes cached storage.
result_buffer_bytes = 67108864
delivery_timeout_ms = 30000
cancel_cleanup_timeout_ms = 5000

[[nodes]]
name = "node-a"
host = "127.0.0.1"
port = 55432

