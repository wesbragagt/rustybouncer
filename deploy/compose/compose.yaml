name: rustybouncer-demo
services:
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  rustybouncer:
    image: rustybouncer:latest
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${RUSTYBOUNCER_PORT:-6432}:6432"
    volumes:
      - ../container.toml:/etc/rustybouncer/rustybouncer.toml:ro
volumes:
  postgres-data:
