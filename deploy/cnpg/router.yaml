apiVersion: v1
kind: Service
metadata:
  name: postgres-1
  namespace: rustybouncer-demo
spec:
  publishNotReadyAddresses: true
  selector:
    cnpg.io/instanceName: postgres-1
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-2
  namespace: rustybouncer-demo
spec:
  publishNotReadyAddresses: true
  selector:
    cnpg.io/instanceName: postgres-2
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-3
  namespace: rustybouncer-demo
spec:
  publishNotReadyAddresses: true
  selector:
    cnpg.io/instanceName: postgres-3
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustybouncer
  namespace: rustybouncer-demo
data:
  rustybouncer.toml: |
    listen = "0.0.0.0:6432"
    max_clients = 100
    route_selects = true
    probe_interval_ms = 500
    probe_timeout_ms = 1000
    wait_timeout_ms = 180000
    startup_timeout_ms = 5000
    query_timeout_ms = 300000
    read_retry_timeout_ms = 600000
    read_max_attempts = 3
    probe_user = "app"
    probe_database = "app"

    [[nodes]]
    name = "postgres-1"
    host = "postgres-1"
    port = 5432

    [[nodes]]
    name = "postgres-2"
    host = "postgres-2"
    port = 5432

    [[nodes]]
    name = "postgres-3"
    host = "postgres-3"
    port = 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustybouncer
  namespace: rustybouncer-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustybouncer
  template:
    metadata:
      labels:
        app: rustybouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustybouncer
          image: rustybouncer:latest
          imagePullPolicy: Never
          args: [/config/rustybouncer.toml]
          ports:
            - containerPort: 6432
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: 6432
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustybouncer
---
apiVersion: v1
kind: Service
metadata:
  name: rustybouncer
  namespace: rustybouncer-demo
spec:
  selector:
    app: rustybouncer
  ports:
    - port: 6432
      targetPort: 6432
