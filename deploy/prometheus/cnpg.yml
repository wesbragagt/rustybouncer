# Optional core Kubernetes resources; no Prometheus Operator CRDs.
apiVersion: v1
kind: Service
metadata:
  name: rustybouncer-metrics
  namespace: rustybouncer-demo
spec:
  type: ClusterIP
  selector:
    app: rustybouncer
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
# Example restrictive ingress policy. Adapt SQL-client selectors to real clients
# BEFORE applying. Requires a NetworkPolicy-enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustybouncer-private-ingress
  namespace: rustybouncer-demo
spec:
  podSelector:
    matchLabels:
      app: rustybouncer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - podSelector:
            matchLabels:
              app: sql-client
      ports:
        - protocol: TCP
          port: 6432
