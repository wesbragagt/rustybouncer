global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - rules.yml
scrape_configs:
  - job_name: rustybouncer
    metrics_path: /metrics
    scrape_timeout: 3s
    static_configs:
      - targets: ['rustybouncer-metrics.rustybouncer-demo.svc:9090']
        labels:
          discovery_profile: interval500ms_timeout1000ms
