# Example Docker/Podman network: PostgreSQL must be reachable as "postgres".
listen = "0.0.0.0:6432"
max_clients = 100
route_selects = true
probe_interval_ms = 500
probe_timeout_ms = 1000
wait_timeout_ms = 10000
startup_timeout_ms = 5000
query_timeout_ms = 300000
read_retry_timeout_ms = 600000
read_max_attempts = 3
probe_user = "postgres"
probe_database = "postgres"

[[nodes]]
name = "postgres"
host = "postgres"
port = 5432
